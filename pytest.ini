[pytest]
# 只收集 tests/：否则 pytest 会去扫 .venv、alembic 里的脚本，
# 既慢又可能误收集到同名文件
testpaths = tests
# -v      每个用例一行（红/绿一眼可见）
# --tb=short  失败只打关键几帧，完整栈在日志里刷三屏反而没人看
addopts = -v --tb=short
# 让 `pytest` 在项目根目录之外启动也能 import 到 app / tests
pythonpath = .
# 严格模式：把 warning 里和本项目相关的那些（未注册的标记、协程未 await）
# 暴露出来，避免以后加了 @pytest.mark.slow 之类却被静默忽略
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
